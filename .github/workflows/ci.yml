# Pull requests and main: fast checks, then build the image and convert real Altium
# projects with it. On a v* tag also build the macOS and Windows engines, push the image to
# GHCR, and release the plugin (with every engine), the app (app.yml) and the corresponding
# source.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wrapper scripts
        run: |
          python3 -m py_compile pcbferry pcbferry_dru.py pcbferry-container plugin/*.py plugin/src/*.py plugin/src/olefile/*.py app/tests/*.py
          python3 pcbferry --help > /dev/null
          shellcheck build.sh plugin/engine/*.sh plugin/src/*.sh

      - name: Patches apply to the pinned KiCad
        run: |
          tag=$(sed -n 's/^ARG KICAD_TAG=//p' Containerfile)
          commit=$(sed -n 's/^ARG KICAD_COMMIT=//p' Containerfile)
          git clone -q --depth 1 --branch "$tag" https://gitlab.com/kicad/code/kicad.git kicad
          test "$(git -C kicad rev-parse HEAD)" = "$commit"
          export LC_ALL=C
          for p in patches/[0-9][0-9][0-9][0-9]-*.patch; do
            echo "applying ${p##*/}"
            git -C kicad apply --whitespace=nowarn "$PWD/$p"
          done

  # KiCad -> Altium: the Rust converter, and KiCad's demos written as PcbDocs (the files to open
  # in Altium Designer, see k2a/ALTIUM-CHECK.md)
  kicad2altium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: k2a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            k2a/target
          key: cargo-${{ hashFiles('k2a/Cargo.lock') }}

      - name: Format, lints, unit tests
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release --lib
          cargo build --release

      - name: KiCad's demos as PcbDocs and SchDocs
        run: |
          tag=$(sed -n 's/^ARG KICAD_TAG=//p' ../Containerfile)
          git clone -q --depth 1 --branch "$tag" --filter=blob:none --sparse https://gitlab.com/kicad/code/kicad.git ../kicad
          git -C ../kicad sparse-checkout set demos
          mkdir -p ../out
          find ../kicad/demos -name '*.kicad_pcb' -print0 | while IFS= read -r -d '' f; do
            name=$(basename "${f%.kicad_pcb}")
            cp "$f" "../out/$name.kicad_pcb"
            ./target/release/kicad2altium "$f" "../out/$name.PcbDoc"
          done
          # Each project's schematic, in a folder of its own: a hierarchy is several SchDocs
          find ../kicad/demos -name '*.kicad_pro' -print0 | while IFS= read -r -d '' p; do
            sch="${p%.kicad_pro}.kicad_sch"
            [ -f "$sch" ] || continue
            name=$(basename "${p%.kicad_pro}")
            mkdir -p "../out/$name-sch"
            ./target/release/kicad2altium "$sch" "../out/$name-sch/$name.SchDoc"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: kicad2altium-demos
          path: out/
          retention-days: 30

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: write   # release assets on tags
      packages: write   # ghcr.io push on tags
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (KiCad build needs ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: pcbferry:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint kicad-cli pcbferry:ci version
          docker run --rm --entrypoint kicad-cli pcbferry:ci sch import --help
          docker run --rm --entrypoint kicad-cli pcbferry:ci pcb import --help | grep -q -- --footprint-slash
          docker run --rm pcbferry:ci --version

      - name: Convert real Altium projects
        run: |
          set -euo pipefail
          fetch() {  # repo commit folder
            git init -q "$3"
            git -C "$3" fetch -q --depth 1 "https://github.com/$1" "$2"
            git -C "$3" checkout -q FETCH_HEAD
          }
          fetch yasir-shahzad/Digispark-ATTINY85 98ad05c3af666577e37e6065dfea6969bdd86c8b corpus/attiny85
          fetch sinara-hw/Kasli 98ffc2b1b2c60cfbf7acc94f949f92f182a6fc77 corpus/kasli
          for p in attiny85/hardware/ATTiny85.PrjPcb kasli/Kasli.PrjPCB; do
            name=$(basename "${p%.*}")
            echo "::group::$name"
            PCBFERRY_IMAGE=pcbferry:ci PCBFERRY_ENGINE=docker \
              ./pcbferry-container --check --fill-zones "corpus/$p" "out/$name"
            echo "::endgroup::"
            python3 - "out/$name/import-reports/summary.json" <<'EOF'
          import json, sys
          s = json.load(open(sys.argv[1]))
          assert s["ok"], f"{sys.argv[1]}: a step failed"
          rules = [st for st in s["steps"] if st["step"] == "custom rules"]
          assert rules and rules[0]["ok"], f"{sys.argv[1]}: custom rules not written: {rules}"
          issues = {t: n for st in s["steps"] for t, n in st.get("library_issues", {}).items() if n}
          assert not issues, f"{sys.argv[1]}: unlinked symbols or footprints: {issues}"
          print(sys.argv[1], "ok")
          EOF
          done

      - name: Linux engine and KiCad plugin
        run: |
          set -euo pipefail
          version=$(python3 pcbferry --version | awk '{print $2}')
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; fi
          mkdir -p dist
          PCBFERRY_ENGINE=docker plugin/engine/bundle-linux.sh pcbferry:ci dist/pcbferry-engine-linux-x86_64.tar.xz
          python3 plugin/package.py --version "$version" --out dist \
            --engine linux-x86_64=dist/pcbferry-engine-linux-x86_64.tar.xz
          # Through the plugin's own code, on an older distribution than the image's
          docker run --rm -v "$PWD:/w" -w /w python:3.11-slim python3 plugin/test_plugin.py \
            "dist/pcbferry-kicad-plugin-$version.zip" dist \
            corpus/attiny85/hardware/ATTiny85.PrjPcb corpus/kasli/Kasli.PrjPCB

      - name: KiCad -> Altium round trip over KiCad's demos, read back with this engine
        run: |
          set -euo pipefail
          mkdir -p engine && tar -xf dist/pcbferry-engine-linux-x86_64.tar.xz -C engine
          tag=$(sed -n 's/^ARG KICAD_TAG=//p' Containerfile)
          git clone -q --depth 1 --branch "$tag" --filter=blob:none --sparse https://gitlab.com/kicad/code/kicad.git kicad-demos
          git -C kicad-demos sparse-checkout set demos
          cd k2a
          KICAD_CLI=$PWD/../engine/pcbferry-engine/bin/kicad-cli KICAD_DEMOS=$PWD/../kicad-demos/demos \
            cargo test --release --test roundtrip -- --nocapture --test-threads 2
          KICAD_CLI=$PWD/../engine/pcbferry-engine/bin/kicad-cli KICAD_DEMOS=$PWD/../kicad-demos/demos \
            cargo test --release --test schematics -- --nocapture --test-threads 2

      - name: The Rust converter (app/) against the script, with this engine
        run: |
          set -euo pipefail
          cd app
          cargo build --release -p pcbferry-cli
          # The engine as the app downloads it: unpacked by the Rust code, kicad-cli runnable
          PCBFERRY_TEST_ENGINE_ARCHIVE=$PWD/../dist/pcbferry-engine-linux-x86_64.tar.xz \
            cargo test --release -p pcbferry-core --test engine -- --nocapture
          python3 -I tests/script_parity.py --engine "$PWD/../engine/pcbferry-engine/bin/kicad-cli" \
            --rust target/release/pcbferry --out ../parity \
            ../corpus/attiny85/hardware/ATTiny85.PrjPcb ../corpus/kasli/Kasli.PrjPCB

      - uses: actions/upload-artifact@v4
        with:
          name: kicad-plugin
          path: |
            dist/pcbferry-kicad-plugin-*.zip
            dist/pcbferry-engine-*.tar.xz
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversions
          path: out/*/import-reports/
          if-no-files-found: ignore

      - name: Extract corresponding source
        run: |
          id=$(docker create pcbferry:ci)
          docker cp "$id:/opt/kicad-altium/share/doc/pcbferry" source
          docker rm "$id"
          ls -l source

      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pcbferry   # image names are lowercase
          for tag in "${GITHUB_REF_NAME}" latest; do
            docker tag pcbferry:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      - name: Corresponding source for the release
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p release
          tar -C source -czf release/pcbferry-patches.tar.gz patches SOURCE.txt
          cp source/kicad-*-pcbferry-source.tar.xz release/

      - uses: actions/upload-artifact@v4
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        with:
          name: release-source
          path: release/
          retention-days: 7

  engine-macos:
    needs: checks
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/engine-macos.yml

  engine-windows:
    needs: checks
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/engine-windows.yml

  app:
    needs: checks
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/app.yml

  release:
    needs: [build, engine-macos, engine-windows, app]
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kicad-plugin
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: engine-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: engine-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: dist

      - name: Plugin with every engine, and the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python3 pcbferry --version | awk '{print $2}')
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; fi
          rm -f dist/pcbferry-kicad-plugin-*.zip
          python3 plugin/package.py --version "$version" --out dist \
            --engine linux-x86_64=dist/pcbferry-engine-linux-x86_64.tar.xz \
            --engine macos-arm64=dist/pcbferry-engine-macos-arm64.tar.xz \
            --engine windows-x86_64=dist/pcbferry-engine-windows-x86_64.tar.xz
          python3 -I -c "import json,zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); f=json.loads(z.read('plugins/engine.json'))['files']; assert len(f)==3, f; print(sorted(f))" \
            "dist/pcbferry-kicad-plugin-$version.zip"
          # The app downloads its engine from the list the plugin carries
          unzip -p "dist/pcbferry-kicad-plugin-$version.zip" plugins/engine.json > dist/engine.json
          app_version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)
          [ "$app_version" = "$version" ] || { echo "app/Cargo.toml says $app_version, the release is $version"; exit 1; }
          ls dist/pcbferry-app-linux-x86_64.tar.gz dist/pcbferry-app-macos-arm64.zip dist/pcbferry-app-windows-x86_64.zip
          # A manual run (workflow_dispatch) stops here: it checks the release without making one
          if [[ $GITHUB_REF != refs/tags/v* ]]; then ls -l dist; exit 0; fi
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            dist/kicad-*-pcbferry-source.tar.xz dist/pcbferry-patches.tar.gz \
            "dist/pcbferry-kicad-plugin-$version.zip" dist/pcbferry-engine-*.tar.xz \
            dist/packages.json dist/repository.json dist/engine.json dist/pcbferry-app-*
