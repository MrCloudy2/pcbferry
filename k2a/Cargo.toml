[package]
name = "pcbferry-k2a"
version = "0.1.0"
edition = "2021"
description = "KiCad board to Altium PcbDoc converter (pcbferry's reverse direction)"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "kicad2altium"
path = "src/main.rs"

[dependencies]
cfb = "0.16"
serde_json = "1"

[profile.release]
lto = true
