[package]
name = "pcbferry-core"
description = "pcbferry's conversions: Altium to KiCad through the patched kicad-cli, KiCad to Altium through kicad2altium"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cfb = "0.16"
serde_json = "1"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "optimization"] }
tar = "0.4"
sha2 = "0.10"
ureq = "3"
pcbferry-k2a = { path = "../../../k2a" }
